name: Feed Canary

# Daily check that every NASCAR CDN endpoint pattern we depend on still answers
# with the shape our normalizers expect (see src/app/canary.ts). A red run is
# the alert: GitHub emails the repository owner on workflow failure. WS-C of
# the launch plan moves this onto the production server with a feed_status
# table and a "data delayed" notice; until then this is the v0.

on:
  schedule:
    # 09:00 UTC daily — after any overnight CDN maintenance, before US mornings.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run canary
        run: bun run canary --json canary-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report
          path: canary-report.json
          if-no-files-found: ignore
          retention-days: 30
