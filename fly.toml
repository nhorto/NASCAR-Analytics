# Fly.io app config (launch plan WS-B, D10). The app name is the D2
# placeholder — rename when the product name/domain is decided (end of week 2).
# First deploy + secrets: docs/runbooks/deploy.md.
app = "looplab"
primary_region = "iad"

[build]

[env]
  APP_ENV = "production"
  NASCAR_DATA_DIR = "/data"
  PORT = "8080"
  # In-process Monday 12:00 UTC refresh (D18). Requires auto_stop off below.
  ENABLE_REFRESH_CRON = "1"
  # In-process daily 09:00 UTC upstream-feed canary (WS-C).
  ENABLE_CANARY_CRON = "1"
  # In-process Thursday 16:00 + Saturday 22:00 UTC predictions runs (WS-F).
  ENABLE_PREDICTIONS_CRON = "1"
  # Absolute origin for auth email links (WS-D). Update when D2 lands a real
  # domain; required in production (boot fails without it).
  APP_BASE_URL = "https://looplab.fly.dev"

[mounts]
  source = "nascar_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The refresh cron and Litestream must keep running between requests.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
